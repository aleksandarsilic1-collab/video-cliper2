<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Clipper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-aurora" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="bg-grid"></div>
    <div class="particles">
      <span class="particle" style="left:6%;  top:18%; animation-delay:0s;"></span>
      <span class="particle" style="left:15%; top:62%; animation-delay:2.1s;"></span>
      <span class="particle" style="left:24%; top:32%; animation-delay:0.8s;"></span>
      <span class="particle" style="left:33%; top:80%; animation-delay:3.4s;"></span>
      <span class="particle" style="left:42%; top:12%; animation-delay:1.6s;"></span>
      <span class="particle" style="left:51%; top:48%; animation-delay:4.2s;"></span>
      <span class="particle" style="left:60%; top:24%; animation-delay:2.7s;"></span>
      <span class="particle" style="left:68%; top:72%; animation-delay:0.3s;"></span>
      <span class="particle" style="left:76%; top:8%;  animation-delay:3.9s;"></span>
      <span class="particle" style="left:85%; top:56%; animation-delay:1.2s;"></span>
      <span class="particle" style="left:92%; top:30%; animation-delay:5s;"></span>
      <span class="particle" style="left:10%; top:44%; animation-delay:5.6s;"></span>
      <span class="particle" style="left:57%; top:88%; animation-delay:4.7s;"></span>
      <span class="particle" style="left:31%; top:55%; animation-delay:2.4s;"></span>
      <span class="particle" style="left:72%; top:42%; animation-delay:3.1s;"></span>
    </div>
    <div class="bg-vignette"></div>
  </div>

  <header>
    <div class="brand">
      <div class="brand-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/>
        </svg>
      </div>
      <h1>Video Clipper</h1>
    </div>
    <p>Upload a video, paste a YouTube link, pick your cut points and clip it.</p>
  </header>

  <main>
    <section id="upload-section">
      <div id="drop-zone">
        <input type="file" id="file-input" accept="video/*" hidden>
        <div class="upload-icon">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <p class="drop-title">Drag &amp; drop a video here</p>
        <p class="drop-sub">or</p>
        <button id="choose-btn" class="btn-primary">Browse Files</button>
        <p id="status"></p>
      </div>

      <div class="divider"><span>or grab from a link</span></div>

      <div id="link-row">
        <div class="link-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </div>
        <input type="url" id="link-input" placeholder="Paste a YouTube or video link...">
        <button id="link-btn" class="btn-primary">Download Video</button>
        <p id="link-status"></p>
      </div>
    </section>

    <section id="editor-section" hidden>
      <div class="editor-grid">
        <div class="card player-card">
          <div class="card-head">
            <h2>Clip Editor</h2>
            <span class="badge" id="video-badge">No video</span>
          </div>
          <video id="player" controls></video>
          <div class="time-info">
            <div class="slider-group">
              <div class="slider-top"><span>Start</span><span class="pill" id="start-display">0:00.0</span></div>
              <input type="range" id="start-slider" min="0" step="0.1" value="0">
            </div>
            <div class="slider-group">
              <div class="slider-top"><span>End</span><span class="pill" id="end-display">0:00.0</span></div>
              <input type="range" id="end-slider" min="0" step="0.1" value="0">
            </div>
          </div>
          <div class="actions">
            <button id="play-btn" class="btn-ghost">Play</button>
            <button id="set-start-btn" class="btn-ghost">Set Start</button>
            <button id="set-end-btn" class="btn-ghost">Set End</button>
            <button id="clip-btn" class="btn-primary">Create Clip</button>
          </div>
        </div>
        <div class="card clips-card">
          <div class="card-head">
            <h2>Your Clips</h2>
            <span class="badge" id="clip-count">0</span>
          </div>
          <ul id="clips-list">
            <li class="empty">No clips yet — make your first cut!</li>
          </ul>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
